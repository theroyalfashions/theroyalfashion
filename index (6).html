<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Fashion — Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f3ef;color:#171717}.top{background:#111;color:#fff;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:2px}.brand span{color:#c7a46a}.wrap{max-width:1200px;margin:35px auto;padding:0 18px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{padding:12px 18px;border:1px solid #ddd;background:#fff;cursor:pointer}.tabs button.active{background:#111;color:#fff}.panel{background:#fff;border:1px solid #e3e0da;padding:25px;margin-bottom:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666}input,select,textarea{padding:12px;border:1px solid #ddd;outline:none}textarea{min-height:100px;resize:vertical}.btn{background:#111;color:#fff;border:0;padding:13px 18px;cursor:pointer}.gold{background:#c7a46a;color:#111}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:12px}.table img{width:55px;height:55px;object-fit:cover;background:#eee}.danger{background:#9d2b2b;color:#fff;border:0;padding:8px;cursor:pointer}.muted{color:#888;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table{font-size:10px}.table th:nth-child(4),.table td:nth-child(4){display:none}}
</style></head><body><div class="top"><div class="brand">♛ THE ROYAL <span>FASHION</span> — ADMIN</div><div class="muted" style="color:#bbb">Private dashboard</div></div>
<div class="wrap"><div class="tabs"><button id="pTab" class="active" onclick="show('products')">Products</button><button id="oTab" onclick="show('orders')">Orders</button></div>
<section id="products"><div class="panel"><h2>Add New Product</h2><p class="muted">Products added here appear on the customer website automatically.</p><form id="form" class="grid" enctype="multipart/form-data"><div class="field"><label>Product Name</label><input name="name" required></div><div class="field"><label>Category</label><select name="category"><option>Mens Sunglasses</option><option>Mens Watch</option><option>Mens Shoes</option><option>Mens Tshirt</option><option>Ladies Watch</option><option>Ladies Shoes</option><option>Ladies Bags</option><option>Wallet</option><option>Belt</option></select></div><div class="field"><label>Sale Price ₹</label><input name="price" type="number" required></div><div class="field"><label>Original Price ₹ (optional)</label><input name="comparePrice" type="number"></div><div class="field"><label>Stock</label><input name="stock" type="number" value="10"></div><div class="field"><label>Product Photo</label><input name="image" type="file" accept="image/*"></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field full"><button class="btn gold">ADD PRODUCT</button></div></form></div>
<div class="panel"><h2>Products</h2><div id="plist">Loading…</div></div></section>
<section id="orders" style="display:none"><div class="panel"><h2>Customer Orders</h2><div id="olist">Loading…</div></div></section></div>
<script>
const auth={Authorization:"Basic "+btoa((prompt("Admin username:")||"")+":"+(prompt("Admin password:")||""))};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...auth};return fetch(url,opt)}
function show(x){document.querySelector("#products").style.display=x==="products"?"block":"none";document.querySelector("#orders").style.display=x==="orders"?"block":"none";document.querySelector("#pTab").classList.toggle("active",x==="products");document.querySelector("#oTab").classList.toggle("active",x==="orders");if(x==="orders")loadOrders()}
document.querySelector("#form").onsubmit=async e=>{e.preventDefault();let r=await api("/api/admin/products",{method:"POST",body:new FormData(e.target)});if(r.ok){e.target.reset();loadProducts();alert("Product added.")}else alert("Could not add product.")};
async function loadProducts(){let r=await api("/api/admin/products");if(r.status===401)return alert("Invalid admin login. Refresh and try again.");let ps=await r.json();document.querySelector("#plist").innerHTML=ps.length?`<table class="table"><tr><th>Photo</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>${ps.map(p=>`<tr><td>${p.image?`<img src="${p.image}">`:"—"}</td><td>${p.name}</td><td>${p.category}</td><td>₹${p.price}</td><td>${p.stock}</td><td><button class="danger" onclick="del('${p.id}')">Delete</button></td></tr>`).join("")}</table>`:"<p class='muted'>No products yet.</p>"}
async function del(id){if(!confirm("Delete this product?"))return;await api("/api/admin/products/"+id,{method:"DELETE"});loadProducts()}
async function loadOrders(){let r=await api("/api/admin/orders");let os=await r.json();document.querySelector("#olist").innerHTML=os.length?`<table class="table"><tr><th>ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>${os.map(o=>`<tr><td>${o.id}</td><td>${o.customer}<br>${o.phone}<br>${o.address}</td><td>${o.items.map(i=>i.name+" × "+i.qty).join("<br>")}</td><td>₹${o.total}</td><td><select onchange="status('${o.id}',this.value)">${["New","Confirmed","Packed","Shipped","Delivered","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table>`:"<p class='muted'>No orders yet.</p>"}
async function status(id,s){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})})}
loadProducts();
</script></body></html>
